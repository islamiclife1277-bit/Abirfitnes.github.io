
name: Build ABIR FITNESS PRO APK

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extract Android project
        run: |
          unzip -o *.zip -d project
          find project -name build.gradle.kts

      - name: Build APK
        run: |
          cd project/ABIR_FITNESS_Pro
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ABIR-FITNESS-PRO-APK
          path: project/ABIR_FITNESS_Pro/app/build/outputs/apk/debug/app-debug.apk
          
